name: publish

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0). Leave empty to use package.json version."
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Determine version & create draft GitHub Release ──────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            # Branch push: use package.json version + short SHA for uniqueness
            BASE=$(node -p "require('./packages/desktop/package.json').version")
            SHORT_SHA="${GITHUB_SHA::7}"
            V="${BASE}-dev.${SHORT_SHA}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Create the tag if it doesn't exist (workflow_dispatch case)
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Create draft release (or skip if it already exists)
          gh release create "$TAG" --draft --title "$TAG" --generate-notes || true

  # ── Build the opencode server (node bundle) ──────────────────────────
  build-server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install

      - name: Build server (node target)
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCODE_CHANNEL: prod
        run: bun script/build-node.ts

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-server-node
          path: packages/opencode/dist/node/

  # ── Build Electron desktop app (matrix) ──────────────────────────────
  build-desktop:
    needs: [prepare, build-server]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_flag: --mac --arm64
            target: mac-arm64
          - os: macos-13
            platform_flag: --mac --x64
            target: mac-x64
          - os: windows-latest
            platform_flag: --win
            target: win-x64
          - os: ubuntu-latest
            platform_flag: --linux
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - run: bun install

      # Download the pre-built server node bundle
      - uses: actions/download-artifact@v4
        with:
          name: opencode-server-node
          path: packages/opencode/dist/node/

      - name: Stamp version
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCODE_CHANNEL: prod
        shell: bash
        run: |
          # Copy icons for the channel
          bun ./scripts/copy-icons.ts prod
          # Update package.json version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build (electron-vite)
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
        run: bun run build

      # Use --publish never so we control uploads in the finalize step.
      # This avoids race conditions where two mac builds overwrite each
      # other's latest-mac.yml on the GitHub Release.
      - name: Package
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never --config electron-builder.config.ts
        timeout-minutes: 30

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap

  # ── Finalize: upload artifacts, merge latest-*.yml, undraft ───────────
  finalize:
    needs: [prepare, build-desktop]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: /tmp/desktop-artifacts

      # Upload all installer/archive artifacts to the release
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          for ext in dmg zip exe AppImage deb rpm blockmap; do
            for f in /tmp/desktop-artifacts/desktop-*/*."$ext"; do
              [ -f "$f" ] || continue
              echo "Uploading $(basename "$f")"
              gh release upload "$TAG" "$f" --clobber || true
            done
          done

      # Merge latest-*.yml files from all platform builds into combined
      # manifests so electron-updater finds all architectures in one file.
      - name: Merge and upload latest-*.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          merge_yml() {
            local out_name="$1"
            shift
            local files=()
            for pattern in "$@"; do
              for f in /tmp/desktop-artifacts/desktop-*/"$pattern"; do
                [ -f "$f" ] && files+=("$f")
              done
            done
            if [ ${#files[@]} -eq 0 ]; then
              echo "No files found for $out_name, skipping"
              return
            fi
            # Extract all file entries from all yml files and merge
            {
              echo "version: $VERSION"
              echo "files:"
              for f in "${files[@]}"; do
                # Extract file entries (lines between "files:" and "releaseDate:")
                sed -n '/^files:/,/^releaseDate:/{ /^files:/d; /^releaseDate:/d; p; }' "$f"
              done
              echo "releaseDate: '$NOW'"
            } > "/tmp/$out_name"
            echo "Uploading merged $out_name"
            gh release upload "$TAG" "/tmp/$out_name" --clobber || true
          }

          merge_yml "latest-mac.yml" "latest-mac.yml"
          merge_yml "latest.yml" "latest.yml"
          merge_yml "latest-linux.yml" "latest-linux.yml"

      - name: Undraft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
